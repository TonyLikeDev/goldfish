# Push a tag like v0.1.0 to build Windows + macOS installers and attach them to a draft GitHub release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # lets GITHUB_TOKEN create the release and upload installers

jobs:
  build:
    strategy:
      fail-fast: false # a Mac failure shouldn't cancel the Windows build
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish always -c.publish=github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: once these repository secrets exist, uncomment the lines
          # (and remove "identity": "-" from package.json for macOS). See README > Code signing.
          # Keep them commented until then: an empty CSC_LINK makes electron-builder fail.
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
